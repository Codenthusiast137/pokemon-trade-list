<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokemon GO Trade List</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #1c2331;
    color: #eee;
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }
  h1 {
    font-size: 20px;
    text-align: center;
    color: #ffcb05;
    margin-bottom: 4px;
  }
  .subtitle { text-align: center; color: #9aa5b8; font-size: 13px; margin-bottom: 16px; }
  .card {
    background: #2a3347;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  input, select {
    width: 100%;
    padding: 10px;
    margin-bottom: 8px;
    border-radius: 8px;
    border: 1px solid #3d4863;
    background: #1c2331;
    color: #eee;
    font-size: 14px;
  }
  button {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #3d5afe;
    color: white;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button.secondary { background: #3d4863; margin-top: 6px; }
  button.danger { background: #e53935; width: auto; padding: 6px 10px; font-size: 12px; }
  button.google {
    background: white;
    color: #1c2331;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .trade-item {
    background: #1c2331;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    border-left: 4px solid #ffcb05;
  }
  .trade-item b { color: #ffcb05; }
  .trade-item .row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .empty { text-align: center; color: #9aa5b8; padding: 20px 0; font-size: 13px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { background: #2a3347; font-weight: 400; }
  .tabs button.active { background: #3d5afe; font-weight: 600; }
  .user-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #2a3347;
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 14px;
    font-size: 13px;
  }
  .user-bar img { width: 28px; height: 28px; border-radius: 50%; margin-right: 8px; }
  .user-bar .left { display: flex; align-items: center; }
  .user-bar button { width: auto; padding: 6px 10px; font-size: 12px; background: #3d4863; }
  #login-screen { text-align: center; padding-top: 60px; }
  #login-screen h1 { margin-bottom: 8px; }
  #login-screen p { color: #9aa5b8; margin-bottom: 24px; font-size: 13px; }
  #app-screen { display: none; }
</style>
</head>
<body>

<div id="login-screen">
  <h1>Pokemon GO Trade List</h1>
  <p>Login dengan akun Google untuk menyimpan dan sinkron data trade kamu di semua device.</p>
  <button class="google" onclick="loginGoogle()">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.3 29.4 35 24 35c-6.1 0-11.3-4.1-13.1-9.6-.4-1.1-.6-2.3-.6-3.4s.2-2.3.6-3.4C12.7 13.1 17.9 9 24 9c3.1 0 5.9 1.1 8.1 3l6-6C34.6 2.5 29.6 0 24 0 14.6 0 6.5 5.4 2.6 13.3 1 16.7 0 20.3 0 24s1 7.3 2.6 10.7C6.5 42.6 14.6 48 24 48c5.5 0 10.5-1.8 14.3-5.1 4.3-3.7 6.8-9.2 6.8-15.8 0-1.6-.2-3.1-.5-4.6z"/></svg>
    Login dengan Google
  </button>
  <div id="login-error" style="color:#e53935; font-size:12px; margin-top:10px;"></div>
</div>

<div id="app-screen">

  <div class="user-bar">
    <div class="left">
      <img id="userPhoto" src="" alt="">
      <span id="userName"></span>
    </div>
    <button onclick="logout()">Keluar</button>
  </div>

  <h1>Pokemon GO Trade List</h1>
  <div class="subtitle">Tersinkron di cloud</div>

  <div class="tabs">
    <button onclick="showTab('add')" id="tab-add" class="active">+ Tambah</button>
    <button onclick="showTab('list')" id="tab-list">List</button>
    <button onclick="showTab('search')" id="tab-search">Cari</button>
  </div>

  <div id="view-add" class="card">
    <input id="pokemonName" placeholder="Nama Pokemon (mis. Machop)">
    <input id="ownerName" placeholder="Nama Trainer">
    <input id="trainerCode" placeholder="Trainer Code (mis. 1234 5678 9012)">
    <input id="schedule" type="datetime-local">
    <button onclick="tambahTrade()">Simpan</button>
  </div>

  <div id="view-list" class="card" style="display:none;">
    <div id="listContainer"></div>
  </div>

  <div id="view-search" class="card" style="display:none;">
    <input id="searchInput" placeholder="Ketik nama trainer, pokemon, code, atau tanggal...">
    <button onclick="cariTrade()">Cari</button>
    <div id="searchResult" style="margin-top:10px;"></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
  // =====================================================================
  // GANTI bagian ini dengan config project Firebase kamu sendiri.
  // Cara dapatkan config: Firebase Console > Project Settings > General
  // > scroll ke "Your apps" > pilih Web app (ikon </>)
  // =====================================================================
  const firebaseConfig = {
    apiKey: "AIzaSyCzfeA-BMyxZM-8zUTQ2YpDULXGpw62ZTo",
    authDomain: "pokemon-trade-schedule-f8b85.firebaseapp.com",
    projectId: "pokemon-trade-schedule-f8b85",
    storageBucket: "pokemon-trade-schedule-f8b85.firebasestorage.app",
    messagingSenderId: "727762123003",
    appId: "1:727762123003:web:a7c5ce55909c4e5796985e"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const provider = new firebase.auth.GoogleAuthProvider();

  let currentUser = null;

  function loginGoogle() {
    document.getElementById("login-error").textContent = "";
    auth.signInWithPopup(provider).catch(err => {
      document.getElementById("login-error").textContent = "Login gagal: " + err.message;
    });
  }

  function logout() {
    auth.signOut();
  }

  auth.onAuthStateChanged(user => {
    if (user) {
      currentUser = user;
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("app-screen").style.display = "block";
      document.getElementById("userName").textContent = user.displayName;
      document.getElementById("userPhoto").src = user.photoURL || "";
      showTab("list");
    } else {
      currentUser = null;
      document.getElementById("login-screen").style.display = "block";
      document.getElementById("app-screen").style.display = "none";
    }
  });

  function tradesCollection() {
    return db.collection("trades").where("uid", "==", currentUser.uid);
  }

  function showTab(tab) {
    ["add", "list", "search"].forEach(t => {
      document.getElementById("view-" + t).style.display = (t === tab) ? "block" : "none";
      document.getElementById("tab-" + t).classList.toggle("active", t === tab);
    });
    if (tab === "list") renderList();
  }

  async function tambahTrade() {
    const pokemonName = document.getElementById("pokemonName").value.trim();
    const ownerName = document.getElementById("ownerName").value.trim();
    const trainerCode = document.getElementById("trainerCode").value.trim();
    const schedule = document.getElementById("schedule").value;

    if (!pokemonName || !ownerName || !trainerCode || !schedule) {
      alert("Semua field harus diisi!");
      return;
    }

    await db.collection("trades").add({
      uid: currentUser.uid,
      pokemonName,
      ownerName,
      trainerCode,
      schedule
    });

    document.getElementById("pokemonName").value = "";
    document.getElementById("ownerName").value = "";
    document.getElementById("trainerCode").value = "";
    document.getElementById("schedule").value = "";

    showTab("list");
  }

  function formatTanggal(iso) {
    const d = new Date(iso);
    return d.toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" });
  }

  function renderTradeItem(id, trade) {
    return `
      <div class="trade-item">
        <div><b>${trade.pokemonName}</b> - ${trade.ownerName}</div>
        <div style="color:#9aa5b8; font-size:12px;">Code: ${trade.trainerCode}</div>
        <div>Jadwal: ${formatTanggal(trade.schedule)}</div>
        <div class="row">
          <span></span>
          <button class="danger" onclick="hapusTrade('${id}')">Hapus</button>
        </div>
      </div>`;
  }

  async function renderList() {
    const container = document.getElementById("listContainer");
    container.innerHTML = '<div class="empty">Memuat...</div>';
    const snapshot = await tradesCollection().get();
    let docs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    docs.sort((a, b) => new Date(a.schedule) - new Date(b.schedule));

    if (docs.length === 0) {
      container.innerHTML = '<div class="empty">Belum ada data trade.</div>';
      return;
    }
    container.innerHTML = docs.map(t => renderTradeItem(t.id, t)).join("");
  }

  async function hapusTrade(id) {
    if (!confirm("Hapus data trade ini?")) return;
    await db.collection("trades").doc(id).delete();
    renderList();
  }

  async function cariTrade() {
    const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
    const resultDiv = document.getElementById("searchResult");
    if (!keyword) {
      resultDiv.innerHTML = '<div class="empty">Masukkan kata kunci.</div>';
      return;
    }
    resultDiv.innerHTML = '<div class="empty">Mencari...</div>';
    const snapshot = await tradesCollection().get();
    const docs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    const hasil = docs.filter(t =>
      t.ownerName.toLowerCase().includes(keyword) ||
      t.pokemonName.toLowerCase().includes(keyword) ||
      t.trainerCode.toLowerCase().includes(keyword) ||
      formatTanggal(t.schedule).toLowerCase().includes(keyword)
    );
    resultDiv.innerHTML = hasil.length
      ? hasil.map(t => renderTradeItem(t.id, t)).join("")
      : '<div class="empty">Tidak ditemukan.</div>';
  }
</script>

</body>
</html>
