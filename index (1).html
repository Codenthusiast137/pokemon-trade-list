<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade List — Trainer Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --felt: #16261d;
    --felt-2: #1e3327;
    --felt-line: #2a4433;
    --cream: #fbf3e1;
    --cream-2: #f3e8cf;
    --card-line: #e4d2a1;
    --gold: #c9a227;
    --gold-soft: #dbc06a;
    --ink: #23201b;
    --ink-soft: #6b6357;
    --coral: #ff6b5b;
    --coral-dark: #e14f40;
    --success: #3fa772;
    --danger: #d64545;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  body {
    font-family: 'Inter', sans-serif;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(255,255,255,0.05), transparent 45%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 8px),
      var(--felt);
    color: var(--cream);
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 48px;
    min-height: 100vh;
  }

  /* ---------- Brand / header ---------- */
  .brand { display: flex; align-items: center; justify-content: center; gap: 9px; margin-bottom: 2px; }
  .pokeball {
    width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(var(--coral) 0 48%, var(--cream) 48% 52%, var(--cream) 52% 100%);
    border: 2px solid var(--ink); position: relative; flex-shrink: 0;
  }
  .pokeball::after {
    content: ""; position: absolute; top: 50%; left: 50%;
    width: 8px; height: 8px; background: var(--cream); border: 2px solid var(--ink);
    border-radius: 50%; transform: translate(-50%,-50%);
  }
  h1.title {
    font-family: 'Baloo 2', sans-serif;
    font-size: 20px; font-weight: 700;
    color: var(--gold-soft);
    margin: 0;
    letter-spacing: 0.2px;
  }
  .subtitle {
    text-align: center; color: rgba(251,243,225,0.45);
    font-size: 11.5px; margin: 3px 0 20px;
    text-transform: uppercase; letter-spacing: 1.2px;
  }

  /* ---------- Trainer ID bar ---------- */
  .id-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--cream);
    border-radius: 14px;
    padding: 8px 8px 8px 8px;
    margin-bottom: 18px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    border: 1px solid var(--card-line);
  }
  .id-bar .left { display: flex; align-items: center; gap: 9px; }
  .id-bar img {
    width: 32px; height: 32px; border-radius: 8px;
    border: 2px solid var(--gold); object-fit: cover;
  }
  .id-bar .name { color: var(--ink); font-weight: 700; font-size: 13px; }
  .id-bar .role { color: var(--ink-soft); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.6px; }
  .id-bar button {
    background: transparent; color: var(--ink-soft); border: 1px solid var(--card-line);
    font-size: 11.5px; padding: 6px 11px; border-radius: 8px; font-weight: 600;
  }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex; gap: 4px; margin-bottom: 16px;
    background: var(--felt-2); border: 1px solid var(--felt-line);
    border-radius: 12px; padding: 4px;
  }
  .tabs button {
    flex: 1; background: transparent; color: rgba(251,243,225,0.55);
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px;
    border: none; border-radius: 9px; padding: 9px 4px; cursor: pointer;
  }
  .tabs button.active { background: var(--coral); color: var(--cream); box-shadow: 0 3px 10px rgba(255,107,91,0.35); }

  /* ---------- Buttons (generic) ---------- */
  button { cursor: pointer; transition: transform 0.08s, filter 0.15s; }
  button:active { transform: scale(0.98); }

  /* ---------- Ticket panel (Tambah form) ---------- */
  .ticket {
    background: var(--cream);
    border-radius: 14px;
    padding: 18px 16px 16px;
    position: relative;
    box-shadow: 0 10px 24px rgba(0,0,0,0.35);
    border: 1.5px dashed var(--gold);
  }
  .ticket::before, .ticket::after {
    content: ""; position: absolute; width: 16px; height: 16px;
    background: var(--felt); border-radius: 50%; top: 50%; transform: translateY(-50%);
  }
  .ticket::before { left: -8px; }
  .ticket::after { right: -8px; }
  .ticket-label {
    font-family: 'Baloo 2', sans-serif; font-size: 11px; font-weight: 700;
    color: var(--coral-dark); text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 14px; text-align: center;
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 5px;
  }
  input {
    width: 100%; padding: 10px 11px; border-radius: 9px;
    border: 1.5px solid var(--card-line); background: white; color: var(--ink);
    font-family: 'Inter', sans-serif; font-size: 14px;
  }
  input#trainerCode { font-family: 'JetBrains Mono', monospace; letter-spacing: 0.5px; }
  input:focus { outline: 2px solid var(--coral); outline-offset: 1px; border-color: var(--coral); }
  .btn-block {
    width: 100%; padding: 12px; border-radius: 9px; border: none;
    background: var(--coral); color: white; font-weight: 700; font-size: 14px;
    font-family: 'Inter', sans-serif;
    box-shadow: 0 4px 12px rgba(255,107,91,0.35);
  }
  .btn-block:active { filter: brightness(0.93); }

  /* ---------- Trade card (list item) ---------- */
  .card-slot { margin-bottom: 14px; }
  .trade-card {
    background: var(--cream);
    border-radius: 13px;
    padding: 3px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    background-image: linear-gradient(155deg, var(--gold) 0%, var(--gold-soft) 35%, var(--gold) 60%, var(--gold-soft) 100%);
  }
  .trade-card-inner {
    background: var(--cream);
    border-radius: 11px;
    border: 1px solid var(--card-line);
    padding: 12px 13px 10px;
  }
  .trade-card-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 6px;
  }
  .trade-card-num {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-soft);
  }
  .trade-card-hp {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600;
    color: var(--ink); background: var(--cream-2); border: 1px solid var(--card-line);
    padding: 2px 7px; border-radius: 20px;
  }
  .pokemon-name {
    font-family: 'Baloo 2', sans-serif; font-size: 17px; font-weight: 700;
    color: var(--ink); line-height: 1.15;
  }
  .trainer-name { color: var(--ink-soft); font-size: 12.5px; font-weight: 500; margin-top: 1px; }
  .flavor-line {
    font-size: 12px; color: var(--ink-soft); font-style: italic;
    border-top: 1px dashed var(--card-line); margin-top: 9px; padding-top: 7px;
  }
  .card-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
  button.danger {
    background: rgba(214,69,69,0.08); color: var(--danger); border: 1px solid rgba(214,69,69,0.35);
    font-size: 11.5px; font-weight: 700; padding: 5px 11px; border-radius: 7px;
  }

  /* ---------- Search ---------- */
  .search-box { background: var(--cream); border-radius: 13px; padding: 14px; box-shadow: 0 8px 20px rgba(0,0,0,0.35); border: 1px solid var(--card-line); margin-bottom: 14px; }

  /* ---------- Empty state ---------- */
  .empty {
    text-align: center; color: rgba(251,243,225,0.5); padding: 40px 12px; font-size: 13px;
  }
  .empty .icon { font-size: 30px; display: block; margin-bottom: 10px; opacity: 0.6; }

  /* ---------- Login screen ---------- */
  #login-screen { text-align: center; padding-top: 60px; }
  #login-screen .pokeball { width: 52px; height: 52px; margin: 0 auto 20px; }
  #login-screen .pokeball::after { width: 17px; height: 17px; }
  #login-screen h1 { font-family: 'Baloo 2', sans-serif; font-size: 23px; color: var(--gold-soft); margin-bottom: 10px; }
  #login-screen p { color: rgba(251,243,225,0.6); margin-bottom: 26px; font-size: 13.5px; line-height: 1.55; padding: 0 14px; }
  button.google {
    background: var(--cream); color: var(--ink); border: none;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }
  #login-error { color: #ff9a8f; font-size: 12px; margin-top: 14px; }
  #app-screen { display: none; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="pokeball"></div>
  <h1>Trade List</h1>
  <p>Login dengan akun Google untuk membuka buku catatan trade kamu — tersimpan dan tersinkron di semua device.</p>
  <button class="google" onclick="loginGoogle()">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.3 29.4 35 24 35c-6.1 0-11.3-4.1-13.1-9.6-.4-1.1-.6-2.3-.6-3.4s.2-2.3.6-3.4C12.7 13.1 17.9 9 24 9c3.1 0 5.9 1.1 8.1 3l6-6C34.6 2.5 29.6 0 24 0 14.6 0 6.5 5.4 2.6 13.3 1 16.7 0 20.3 0 24s1 7.3 2.6 10.7C6.5 42.6 14.6 48 24 48c5.5 0 10.5-1.8 14.3-5.1 4.3-3.7 6.8-9.2 6.8-15.8 0-1.6-.2-3.1-.5-4.6z"/></svg>
    Login dengan Google
  </button>
  <div id="login-error"></div>
</div>

<div id="app-screen">

  <div class="id-bar">
    <div class="left">
      <img id="userPhoto" src="" alt="">
      <div>
        <div class="name" id="userName"></div>
        <div class="role">Trainer</div>
      </div>
    </div>
    <button onclick="logout()">Keluar</button>
  </div>

  <div class="brand">
    <div class="pokeball"></div>
    <h1 class="title">Trade List</h1>
  </div>
  <div class="subtitle">Buku Catatan Trading</div>

  <div class="tabs">
    <button onclick="showTab('add')" id="tab-add" class="active">+ Tambah</button>
    <button onclick="showTab('list')" id="tab-list">List</button>
    <button onclick="showTab('search')" id="tab-search">Cari</button>
  </div>

  <div id="view-add">
    <div class="ticket">
      <div class="ticket-label">Slip Permintaan Trade</div>
      <div class="field">
        <label>Nama Pokemon</label>
        <input id="pokemonName" placeholder="mis. Machop">
      </div>
      <div class="field">
        <label>Nama Trainer</label>
        <input id="ownerName" placeholder="Nama trainer/penukar">
      </div>
      <div class="field">
        <label>Trainer Code</label>
        <input id="trainerCode" placeholder="1234 5678 9012">
      </div>
      <div class="field">
        <label>Jadwal Trade</label>
        <input id="schedule" type="datetime-local">
      </div>
      <button class="btn-block" onclick="tambahTrade()">Simpan Slip</button>
    </div>
  </div>

  <div id="view-list" style="display:none;">
    <div id="listContainer"></div>
  </div>

  <div id="view-search" style="display:none;">
    <div class="search-box">
      <div class="field" style="margin-bottom:10px;">
        <input id="searchInput" placeholder="Cari nama trainer, pokemon, code, tanggal...">
      </div>
      <button class="btn-block" onclick="cariTrade()">Cari</button>
    </div>
    <div id="searchResult"></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCzfeA-BMyxZM-8zUTQ2YpDULXGpw62ZTo",
    authDomain: "pokemon-trade-schedule-f8b85.firebaseapp.com",
    projectId: "pokemon-trade-schedule-f8b85",
    storageBucket: "pokemon-trade-schedule-f8b85.firebasestorage.app",
    messagingSenderId: "727762123003",
    appId: "1:727762123003:web:a7c5ce55909c4e5796985e"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const provider = new firebase.auth.GoogleAuthProvider();

  let currentUser = null;

  function loginGoogle() {
    document.getElementById("login-error").textContent = "";
    auth.signInWithPopup(provider).catch(err => {
      document.getElementById("login-error").textContent = "Login gagal: " + err.message;
    });
  }

  function logout() {
    auth.signOut();
  }

  auth.onAuthStateChanged(user => {
    if (user) {
      currentUser = user;
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("app-screen").style.display = "block";
      document.getElementById("userName").textContent = user.displayName;
      document.getElementById("userPhoto").src = user.photoURL || "";
      showTab("list");
    } else {
      currentUser = null;
      document.getElementById("login-screen").style.display = "block";
      document.getElementById("app-screen").style.display = "none";
    }
  });

  function tradesCollection() {
    return db.collection("trades").where("uid", "==", currentUser.uid);
  }

  function showTab(tab) {
    ["add", "list", "search"].forEach(t => {
      document.getElementById("view-" + t).style.display = (t === tab) ? "block" : "none";
      document.getElementById("tab-" + t).classList.toggle("active", t === tab);
    });
    if (tab === "list") renderList();
  }

  async function tambahTrade() {
    const pokemonName = document.getElementById("pokemonName").value.trim();
    const ownerName = document.getElementById("ownerName").value.trim();
    const trainerCode = document.getElementById("trainerCode").value.trim();
    const schedule = document.getElementById("schedule").value;

    if (!pokemonName || !ownerName || !trainerCode || !schedule) {
      alert("Semua field harus diisi!");
      return;
    }

    await db.collection("trades").add({
      uid: currentUser.uid,
      pokemonName,
      ownerName,
      trainerCode,
      schedule
    });

    document.getElementById("pokemonName").value = "";
    document.getElementById("ownerName").value = "";
    document.getElementById("trainerCode").value = "";
    document.getElementById("schedule").value = "";

    showTab("list");
  }

  function formatTanggal(iso) {
    const d = new Date(iso);
    return d.toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" });
  }

  function renderTradeItem(id, trade, index, total) {
    const num = String(index + 1).padStart(3, "0");
    const totalStr = String(total).padStart(3, "0");
    return `
      <div class="card-slot">
        <div class="trade-card">
          <div class="trade-card-inner">
            <div class="trade-card-top">
              <span class="trade-card-num">${num}/${totalStr}</span>
              <span class="trade-card-hp">${trade.trainerCode}</span>
            </div>
            <div class="pokemon-name">${trade.pokemonName}</div>
            <div class="trainer-name">Trainer: ${trade.ownerName}</div>
            <div class="flavor-line">Jadwal trade: ${formatTanggal(trade.schedule)}</div>
            <div class="card-actions">
              <button class="danger" onclick="hapusTrade('${id}')">Hapus</button>
            </div>
          </div>
        </div>
      </div>`;
  }

  async function renderList() {
    const container = document.getElementById("listContainer");
    container.innerHTML = '<div class="empty">Memuat...</div>';
    const snapshot = await tradesCollection().get();
    let docs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    docs.sort((a, b) => new Date(a.schedule) - new Date(b.schedule));

    if (docs.length === 0) {
      container.innerHTML = '<div class="empty"><span class="icon">🗂️</span>Belum ada slip trade. Buka tab Tambah untuk mulai.</div>';
      return;
    }
    container.innerHTML = docs.map((t, i) => renderTradeItem(t.id, t, i, docs.length)).join("");
  }

  async function hapusTrade(id) {
    if (!confirm("Hapus data trade ini?")) return;
    await db.collection("trades").doc(id).delete();
    renderList();
  }

  async function cariTrade() {
    const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
    const resultDiv = document.getElementById("searchResult");
    if (!keyword) {
      resultDiv.innerHTML = '<div class="empty">Masukkan kata kunci.</div>';
      return;
    }
    resultDiv.innerHTML = '<div class="empty">Mencari...</div>';
    const snapshot = await tradesCollection().get();
    const docs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    const hasil = docs.filter(t =>
      t.ownerName.toLowerCase().includes(keyword) ||
      t.pokemonName.toLowerCase().includes(keyword) ||
      t.trainerCode.toLowerCase().includes(keyword) ||
      formatTanggal(t.schedule).toLowerCase().includes(keyword)
    );
    resultDiv.innerHTML = hasil.length
      ? hasil.map((t, i) => renderTradeItem(t.id, t, i, hasil.length)).join("")
      : '<div class="empty"><span class="icon">🔍</span>Tidak ditemukan.</div>';
  }
</script>

</body>
</html>
